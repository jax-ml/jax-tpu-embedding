[project]
name = "jax_tpu_embedding"
description = "JAX SparseCore API"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{name = "JAX SC Authors", email="jax-sc-dev@google.com"}]
classifiers = [  # List of https://pypi.org/classifiers/
    "Intended Audience :: Science/Research",
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
]
keywords = ["jax", "tpu", "embedding", "sparsecore", "machine learning", "sparse tensor", "distributed computing"]
dependencies = [
    'absl-py',
    'einops',
    'etils[epath]',
    'flax >= 0.10.3',
    'jax >= 0.10.1',
    'numpy',
    'portpicker',
]

# `version` is set by setuptools to use `jax_tpu_embedding.sparsecore.__version__`.
dynamic = ["version"]

[project.urls]
homepage = "https://github.com/jax-ml/jax-tpu-embedding"
repository = "https://github.com/jax-ml/jax-tpu-embedding"
issue_tracker = "https://github.com/jax-ml/jax-tpu-embedding/issues"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "jax_tpu_embedding.sparsecore.__version__"}

[tool.setuptools.packages.find]
include = ["jax_tpu_embedding*"]

[tool.setuptools.package-data]
"*" = ["*.dylib", "*.so", "*.pyd"]

[tool.ruff]
preview = true
exclude = [
    ".git",
    "build",
    "__pycache__",
]
line-length = 80
indent-width = 2
target-version = "py312"

[tool.ruff.lint]
ignore = [
    # Unnecessary `dict`/`list`/`tuple` collection call (rewrite as literal).
    "C408",
    # Function or method is too complex (McCabe cyclomatic complexity).
    "C901",
    # `zip()` without an explicit `strict=` parameter.
    "B905",
]
select = [
    # flake8-bugbear opinionated / design checks (B9xx).
    "B9",
    # flake8-comprehensions (C4xx) and McCabe cyclomatic complexity (C9xx).
    "C",
    # Pyflakes rules (undefined variables, unused imports, etc.).
    "F",
    # pycodestyle warnings.
    "W",
    # flake8-2020 rules for `sys.version` and `sys.version_info` misuse.
    "YTT",
    # flake8-async rules for asyncio / coroutine best practices.
    "ASYNC",
    # Mixed spaces and tabs in indentation.
    "E101",
    # Expected an indented block.
    "E112",
    # Unexpected indentation.
    "E113",
    # Expected an indented block (comment).
    "E115",
    # Over-indented code or comment.
    "E117",
    # Missing whitespace around operator.
    "E225",
    # Missing whitespace around bitwise or shift operator.
    "E227",
    # Missing whitespace around modulo operator.
    "E228",
]

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.pyrefly]
preset = "default"
python-version = "3.12"
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
ignore-missing-imports = [
    "absl.*",
    "chex.*",
    "clu.*",
    "colabtools.*",
    "einops.*",
    "google_benchmark.*",
    "jax.*",
    "jaxlib.*",
    "numpy.*",
    "jax_tpu_embedding.sparsecore.version",
    "optax.*",
    "orbax.*",
    "packaging.*",
    "portpicker.*",
    "scipy.*",
    "setuptools.*",
    "tensorstore.*",
]
untyped-def-behavior = "check-and-infer-return-any"

[tool.pyrefly.errors]
unused-ignore = "error"

# Strict preset
potential-bad-keyword-argument = "error"
implicit-any-attribute = "error"


